name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="life-tracker-${VERSION}-${TARGET}"
          mkdir -p "$PACKAGE_DIR"
          cp "target/${TARGET}/release/life-tracker" "$PACKAGE_DIR/"
          cp README.md LICENSE "$PACKAGE_DIR/"
          tar -czf "${PACKAGE_DIR}.tar.gz" "$PACKAGE_DIR"
          shasum -a 256 "${PACKAGE_DIR}.tar.gz" > "${PACKAGE_DIR}.tar.gz.sha256"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            life-tracker-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            life-tracker-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
